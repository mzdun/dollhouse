# Settings for the tests of the `shapes` Python bindings. CTest runs them
# through `python -m pytest`, see libs/shapes/CMakeLists.txt; to run them by
# hand against a build tree:
#
#     SHAPES_MODULE_DIR=build/debug/bin .venv/Scripts/python -m pytest libs/shapes/tests/python
#
# Without SHAPES_MODULE_DIR the tests use whichever `shapes` is installed
# (e.g. by `flow dyn-install`).

[pytest]
minversion = 9.0
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers --strict-config
xfail_strict = true
filterwarnings =
    error

# JUnit XML, read by CI reports next to the Google Test results
junit_family = xunit2
junit_suite_name = shapes-python
junit_logging = all
junit_log_passing_tests = false
junit_duration_report = call
