name: Super-linter

on:
  pull_request:

jobs:
  lint:
    name: Super-linter
    runs-on: ubuntu-latest

    permissions:
      # checkout reads the repository; super-linter reads its git history
      # to find the files changed in the PR (VALIDATE_ALL_CODEBASE: false)
      contents: read
      # super-linter runs as a container image pulled from ghcr.io
      packages: read
      # super-linter reports a status check for each linter
      statuses: write
      # super-linter posts its summary as a PR comment
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8.5.0
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true
          LOG_LEVEL: ERROR
          SUPPRESS_POSSUM: true

          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true

          VALIDATE_CPP: true

          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_MYPY: true
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_PYTHON_ISORT: true

          VALIDATE_CSS: true
          VALIDATE_HTML: true

          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSX: true

          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_TSX: true

          IGNORE_GENERATED_FILES: true
          FILTER_REGEX_INCLUDE: ".*/libs/.*|.*/extras/.*|.*/docs/.*|.*/examples/.*|.*/tools/[^/]+\\.py"
          FILTER_REGEX_EXCLUDE: ".*/build/.*|\
            .*/external/.*|\
            .*/tools/.*"

      - name: Lint with clang-format
        uses: DoozyX/clang-format-lint-action@v0.20
        with:
          exclude: ./build ./external ./tools
          clangFormatVersion: 19
          extensions: "h,hpp,inc,cpp,c"
