set noparent
linelength=120
exclude_files=./tools

# The code is C++23. cpplint follows the Google style of C++11/C++17 days:
# - build/c++11 and build/c++17 reject some of the standard headers: 2.x
#   flags <filesystem>, <ratio> and <cfenv>; 1.x also <thread>, <mutex>,
#   <chrono>, <regex>, <system_error> and the like
# - readability/braces misreads C++17/C++20 syntax, e.g. `if (init; cond) x;`
#   or a template lambda `[]<typename T>(T) {...};`; clang-format keeps the
#   braces in shape and -Wmisleading-indentation/-Wpedantic catch the rest
filter=-build/c++11
filter=-build/c++17
filter=-readability/braces
filter=-build/include_order
filter=-build/include_subdir
filter=-build/namespaces
filter=-readability/todo
filter=-runtime/arrays
filter=-runtime/explicit
filter=-runtime/indentation_namespace
filter=-runtime/int
filter=-runtime/references
filter=-whitespace/braces
filter=-whitespace/tab
filter=-whitespace/indent
