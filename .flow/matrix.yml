matrix:
  compiler: [gcc, msvc]
  build_type: [Release, Debug]
  # `off` reads as false, so `-D sanitizer=off` selects the plain builds
  sanitizer: [address, thread, off]
  os: [ubuntu, windows]

exclude:
  - { os: windows, compiler: clang }
  - { os: windows, compiler: gcc }
  - { os: ubuntu, compiler: msvc }
  - { build_type: Release, sanitizer: address }
  - { build_type: Release, sanitizer: thread }
  # MSVC has no ThreadSanitizer
  - { os: windows, sanitizer: thread }

include:
  - build_type: Debug
    preset: debug
    coverage: true

  - build_type: Release
    preset: release

  - os: ubuntu
    conan_settings: [compiler.libcxx=libstdc++11]
    build_generator: ninja
    cpack_generator: [TGZ, DEB]
    ubuntu: true
    home: /home/runner

  - os: windows
    conan2_settings:
      - compiler.cppstd=23
      - compiler.runtime=dynamic
    build_generator: msbuild
    report_os: Windows
    cpack_generator: [ZIP, WIX]
    windows: true
    home: C:/Users/runneradmin

  - os: ubuntu
    report_os: Linux

  - compiler: gcc
    report_compiler: GNU
    gcc: true

  - compiler: clang
    report_compiler: Clang
    clang: true

  - compiler: msvc
    report_compiler: MSVC
    msvc: true

  - os: ubuntu
    build_type: Release
    sanitizer: false
