extensions:
  - proj_flow.ext.cplusplus
  - proj_flow.ext.sign
  - proj_flow.ext.store
  - proj_flow.ext.github
  - proj_flow.ext.test_runner
  - proj_flow.ext.tools
  - proj_flow.minimal.ext.bug_report
  - dollhouse.icons
  - dollhouse.dyn-modules-install
  - proj_flow_test_coverage.ext

entry:
  config: [Conan, CMake]
  build: [Build]
  dyn-install: [Build, DynModulesInstall]
  test: [Build, Test]
  icons: [Icons]
  verify:
    - Build
    - Test
    - Sign
    - Pack
    - SignPackages
    - Store
    - BinInst
    - DevInst

python-dynamic-modules:
  - name: shapes
    enabled-by: DOLLHOUSE_WITH_SHAPES

compiler:
  names:
    clang: [clang, clang++]
    gcc: [gcc, g++]
  os-default: { ubuntu: gcc, windows: msvc }

postproc:
  exclude:
    - { github_os: ubuntu-24.04, sanitizer: address }
    # one ThreadSanitizer job is enough: the races do not depend on the
    # runner, so it runs on the newest one only
    - { github_os: ubuntu-22.04, sanitizer: thread }
    - { github_os: ubuntu-24.04, sanitizer: thread }

cmake:
  vars:
    DOLLHOUSE_COVERALLS: "?config:coverage"
    DOLLHOUSE_COVERALLS_UPLOAD: "?config:upload_to_coveralls"
    DOLLHOUSE_SANITIZE: "?config:sanitizer=address"
    DOLLHOUSE_SANITIZE_THREAD: "?config:sanitizer=thread"
    # Treats warnings as errors (/WX, -Werror). Not a matrix key, so it is
    # always OFF, unless added to the configs with -E, as in
    #   ./flow run -E w-error=on
    # ("true", "yes", "1" and "with-w-error" also work).
    DOLLHOUSE_W_ERROR: "?config:w-error"
    # Declares the `shapes` module safe to run without the GIL, on the
    # free-threaded CPython; it is not thread-safe yet, so only for
    # experiments. Always OFF, unless added with
    #   ./flow run -E freethreaded-shapes=on
    DOLLHOUSE_FREE_THREADED: "?config:freethreaded-shapes"
    # DOLLHOUSE_CUTDOWN_OS: "?runtime:cutdown_os"

# with coverage on, the Test step builds this target instead of running
# ctest: it runs the tests and writes the Coveralls report to
# build/artifacts/coverage
test:
  target: DOLLHOUSE_coveralls

test-runner:
  target: verify
  testsuite:
    root: extras/verify/tests
    data: data
  patches: {}

shortcuts:
  dbg: { build_type: Debug, sanitizer: false }
  rel: { build_type: Release, sanitizer: false }
  nfo: { build_type: RelWithDebInfo, sanitizer: false }
  both: { build_type: [Debug, Release], sanitizer: false }
  all: { build_type: [Debug, Release, RelWithDebInfo], sanitizer: false }
  sane: { build_type: Debug, sanitizer: address }
  tsan: { build_type: Debug, sanitizer: thread }
